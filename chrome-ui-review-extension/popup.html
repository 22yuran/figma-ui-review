<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>一键 UI 走查</title><link rel="stylesheet" href="popup.css"><body>
<main><h1>一键 UI 走查</h1><p class="sub">逐层选择组件，直接得到“Figma / 前端 / 判断”表格</p>
<section><div class="step"><b>1. 选择前端组件</b><span id="picked" class="muted">尚未选择</span></div><button id="pick" class="primary">开始逐层选择</button></section>
<section><div class="step"><b>2. 导入 Figma ZIP</b><span id="zipName" class="muted">尚未导入</span></div><label class="file">选择 ZIP<input id="zip" type="file" accept=".zip,application/zip"></label><select id="page" hidden></select></section>
<section id="scope" class="scope" hidden><div class="step"><b>3. 确认对比范围</b><span id="scopeBadge" class="scope-badge"></span></div><div class="scope-grid"><div><small>Figma</small><b id="scopeFigmaName">—</b><span id="scopeFigmaMeta">—</span></div><div><small>前端</small><b id="scopeRuntimeName">—</b><span id="scopeRuntimeMeta">—</span></div></div><div id="scopeMessage" class="scope-message"></div></section>
<details id="aiSettings" class="ai-settings"><summary>Jev 自动配对</summary><div class="ai-body"><div id="aiConnection" class="ai-hint muted">正在连接本机 Jev 服务…</div><label class="ai-row">模型<input id="aiModel" type="text" value="jev-1.13.0" readonly></label><div class="ai-hint muted">开始走查后自动配对组件与测量对象。局部文字和结构数据发送至 Jev，像素与样式由程序测量。Jev 不支持图标图案的图片检查。</div><button id="aiTest" class="ai-test" type="button">测试 Jev 连接</button><div id="aiTestResult" class="ai-test-result muted" hidden></div></div></details>
<button id="compare" class="primary big" disabled>开始走查</button><div id="status" class="status muted"></div>
<div id="summary" class="summary" hidden></div><div id="results"></div><div id="exports" hidden><button id="html">导出 HTML 报告</button><button id="json">导出 JSON 报告</button><button id="runtime">导出 Runtime（调试）</button></div>
<div id="previewModal" class="preview-modal" hidden><div class="preview-panel"><div class="preview-head"><div><b id="previewTitle">局部对比图</b><span id="previewValues"></span></div><button id="previewClose" aria-label="关闭">×</button></div><div class="preview-grid"><figure><figcaption>Figma</figcaption><canvas id="previewDesign"></canvas><div id="previewDesignEmpty" class="preview-empty" hidden></div></figure><figure><figcaption>前端</figcaption><canvas id="previewRuntime"></canvas><div id="previewRuntimeEmpty" class="preview-empty" hidden></div></figure></div></div></div>
</main><script src="vendor/jszip.min.js"></script><script src="layout-review.js"></script><script src="layout-review-decisions.js"></script><script src="kimi-client.js"></script><script src="jev-client.js"></script><script src="jev-review.js"></script><script src="icon-review.js"></script><script src="image-group-review.js"></script><script src="inspection-contracts.js"></script><script src="inspection-routing.js"></script><script src="inspection-review.js"></script><script src="text-ink.js"></script><script src="capture-state.js"></script><script src="background-review.js"></script><script src="popup.js"></script><script src="layout-review-ui.js"></script><script src="inspection-review-ui.js"></script></body></html>
